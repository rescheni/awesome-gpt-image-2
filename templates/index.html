<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Atelier · 提示词画布</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#08080d;--bg2:#0f0f17;--bg3:#15151f;--panel:rgba(255,255,255,.028);
  --border:rgba(255,255,255,.075);--border2:rgba(255,255,255,.15);
  --text:#f0eee9;--text2:#a8a8b6;--text3:#7c7c8a;
  --accent:#c9a96a;--accent2:#e8d5a8;--purple:#8b7cf6;--green:#6ecf8f;
  --input:rgba(255,255,255,.03);--hover:rgba(255,255,255,.05);
  --glow:0 0 0 1px rgba(201,169,106,.55),0 0 26px rgba(201,169,106,.22);
  --shadow:0 20px 60px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f2f0eb;--bg2:#fff;--bg3:#faf9f6;--panel:rgba(0,0,0,.018);
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.16);
  --text:#1e1b15;--text2:#5a554c;--text3:#7d776e;
  --accent:#a67f38;--accent2:#87682c;--purple:#6252e0;--green:#2f9e5a;
  --input:rgba(0,0,0,.022);--hover:rgba(0,0,0,.035);
  --glow:0 0 0 1px rgba(166,127,56,.5),0 0 22px rgba(166,127,56,.16);
  --shadow:0 16px 44px rgba(70,58,34,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);height:100vh;
  overflow:hidden;transition:background .3s,color .3s}
[data-theme="dark"] body{background-image:
  radial-gradient(ellipse 45% 38% at 10% -6%,rgba(139,124,246,.13),transparent 70%),
  radial-gradient(ellipse 40% 32% at 96% 2%,rgba(201,169,106,.10),transparent 70%),
  radial-gradient(ellipse 60% 40% at 50% 108%,rgba(139,124,246,.06),transparent 70%)}
[data-theme="light"] body{background-image:
  radial-gradient(ellipse 45% 38% at 10% -6%,rgba(139,124,246,.08),transparent 70%),
  radial-gradient(ellipse 40% 32% at 96% 2%,rgba(200,160,80,.10),transparent 70%)}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:54px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);z-index:50}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{width:27px;height:27px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
  box-shadow:0 3px 16px rgba(139,124,246,.35),inset 0 1px 0 rgba(255,255,255,.28);
  transition:box-shadow .3s,transform .3s}
.logo:hover .logo-mark{box-shadow:0 5px 24px rgba(139,124,246,.55);transform:rotate(-6deg) scale(1.06)}
.logo-name{background:linear-gradient(92deg,var(--text) 30%,var(--accent) 70%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-name{font-family:'Space Grotesk';font-size:14.5px;font-weight:600;letter-spacing:.3px}
.logo-name em{font-style:normal;color:var(--accent);font-weight:400}
.tb{display:flex;gap:7px;align-items:center}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:6px 13px;border-radius:8px;
  font-size:12px;cursor:pointer;font-family:inherit;transition:.18s;text-decoration:none;display:inline-block;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--border2)}
.btn-gold{background:linear-gradient(135deg,#d8b877,#b8934f);color:#1a1509;border:none;font-weight:600}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(201,169,106,.3)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2)}
.ib{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;
  border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:13px;color:var(--text2);transition:.18s}
.ib:hover{color:var(--accent);border-color:var(--border2)}
.uchip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#fff}

/* 三栏 */
.grid{display:grid;grid-template-columns:255px 1fr 330px;height:calc(100vh - 54px)}
@media(max-width:1250px){.grid{grid-template-columns:215px 1fr 290px}}
@media(max-width:1010px){.grid{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;overflow-y:auto}}

/* 左栏: 起点库 */
.left{border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.lt{padding:13px 14px 9px;font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;font-family:'Space Grotesk'}
.sbox{padding:0 12px 10px}
.sbox input{width:100%;padding:8px 11px;background:var(--input);border:1px solid var(--border);border-radius:9px;
  color:var(--text);font-size:12px;outline:none;font-family:inherit}
.sbox input:focus{border-color:rgba(201,169,106,.5)}
.tabs2{display:flex;gap:0;padding:0 12px;border-bottom:1px solid var(--border)}
.t2{flex:1;text-align:center;font-size:11.5px;padding:7px 0;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:.2s}
.t2.on{color:var(--accent2);border-bottom-color:var(--accent)}
.lscroll{flex:1;overflow-y:auto;padding:9px 11px}
.lscroll::-webkit-scrollbar{width:3px}.lscroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.starter{padding:7px 9px;border-radius:8px;font-size:12px;color:var(--text2);cursor:pointer;transition:.15s;
  border:1px solid transparent;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.starter:hover{background:var(--hover);color:var(--text);transform:translateX(3px)}
.starter{transition:transform .18s,background .18s,color .18s,border-color .2s}
.starter.on{background:linear-gradient(135deg,rgba(201,169,106,.14),rgba(139,124,246,.07));
  border-color:rgba(201,169,106,.32);color:var(--accent2)}
.starter .ar{opacity:0;font-size:10px;color:var(--accent)}
.starter:hover .ar{opacity:1}
.starter .cc{font-size:9.5px;color:var(--text3);flex-shrink:0}
.grp{font-size:9.5px;color:var(--text3);padding:9px 6px 4px;letter-spacing:1.3px;display:flex;align-items:center;gap:6px}
.grp::after{content:"";flex:1;height:1px;background:var(--border)}

/* 中栏: 提示词画布 */
.mid{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.mhead{padding:13px 18px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.mtitle{font-size:11px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;font-family:'Space Grotesk'}
.progress{display:flex;align-items:center;gap:8px}
.pbar{width:110px;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));transition:.35s;border-radius:2px}
.pnum{font-size:11px;color:var(--text3);font-family:'Space Grotesk'}
.bgrid{flex:1;overflow-y:auto;padding:13px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:start}
.bgrid::-webkit-scrollbar{width:4px}.bgrid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
@media(max-width:700px){.bgrid{grid-template-columns:1fr}}

/* 块卡片 */
.blk{background:var(--panel);border:1.5px solid var(--border);border-radius:13px;padding:11px 13px;cursor:pointer;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.1),border-color .25s,box-shadow .3s,background .3s;
  position:relative;overflow:hidden;backdrop-filter:blur(10px);
  animation:blkIn .45s cubic-bezier(.2,.9,.3,1.1) backwards}
.blk:nth-child(1){animation-delay:.02s}.blk:nth-child(2){animation-delay:.05s}
.blk:nth-child(3){animation-delay:.08s}.blk:nth-child(4){animation-delay:.11s}
.blk:nth-child(5){animation-delay:.14s}.blk:nth-child(6){animation-delay:.17s}
.blk:nth-child(7){animation-delay:.2s}.blk:nth-child(8){animation-delay:.23s}
.blk:nth-child(9){animation-delay:.26s}.blk:nth-child(10){animation-delay:.29s}
@keyframes blkIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.blk::after{content:"";position:absolute;inset:0;border-radius:14px;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at 50% 0%,rgba(201,169,106,.14),transparent 65%);pointer-events:none}
.blk:hover{transform:translateY(-3px);border-color:var(--border2);
  box-shadow:0 12px 34px rgba(0,0,0,.32),0 0 0 1px rgba(255,255,255,.05)}
.blk:hover::after{opacity:1}
.blk.active{border-color:rgba(201,169,106,.75);box-shadow:var(--glow),0 14px 40px rgba(201,169,106,.16);
  background:rgba(201,169,106,.06);transform:translateY(-3px)}
.blk.filled{background:linear-gradient(135deg,rgba(201,169,106,.13),rgba(139,124,246,.055));
  border-color:rgba(201,169,106,.5)}
.blk:not(.filled):not(.active){border-style:dashed;border-color:rgba(255,255,255,.1)}
[data-theme="light"] .blk:not(.filled):not(.active){border-color:rgba(0,0,0,.13)}
.blk.filled::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--purple));
  box-shadow:0 0 14px rgba(201,169,106,.6);animation:barGlow 2.6s ease-in-out infinite}
@keyframes barGlow{0%,100%{opacity:.75}50%{opacity:1}}
.bh{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.bi{font-size:14px;flex-shrink:0}
.bn{font-size:12.5px;color:var(--text);flex:1;font-weight:500}
.bs{font-size:9.5px;padding:1.5px 7px;border-radius:6px;background:var(--border);color:var(--text3);flex-shrink:0}
.bs.done{background:rgba(201,169,106,.22);color:var(--accent2);font-weight:600}
.bs.part{background:rgba(139,124,246,.2);color:var(--purple)}
.bv{font-size:11.5px;color:var(--text2);line-height:1.65;max-height:52px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.bv.empty{color:var(--text3);font-style:italic}
.chips-inline{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.cchip{font-size:10.5px;padding:2.5px 8px;border-radius:100px;background:rgba(201,169,106,.16);
  color:var(--accent2);border:1px solid rgba(201,169,106,.32);font-weight:500}
.bdel{position:absolute;right:9px;top:9px;font-size:11px;color:var(--text3);opacity:0;transition:.2s;padding:2px 5px}
.blk:hover .bdel{opacity:.7}
.bdel:hover{color:#e06c6c;opacity:1 !important}

/* 底部: 提示词预览 */
.mfoot{border-top:1px solid var(--border);padding:13px 18px;background:var(--bg2);max-height:38vh;display:flex;flex-direction:column}
.fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ft{font-size:10px;letter-spacing:1.8px;color:var(--text3);text-transform:uppercase;font-family:'Space Grotesk'}
.out{flex:1;overflow-y:auto;background:var(--input);border:1px solid var(--border);border-radius:11px;
  padding:12px 14px;font-size:12.5px;line-height:1.85;color:var(--text);white-space:pre-wrap;font-weight:300;min-height:80px}
.out::-webkit-scrollbar{width:3px}.out::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.out .ph{color:var(--text3);text-align:center;padding:16px 0;font-size:12px}
.out.has-content{border-color:rgba(201,169,106,.3);box-shadow:inset 0 0 32px rgba(201,169,106,.05)}
.pbar i{position:relative;overflow:hidden}
.pbar i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  animation:shimmer 2.2s linear infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.facts{display:flex;gap:8px;margin-top:9px}
.facts{flex-wrap:wrap}
.btn-outline{background:transparent;border:1.5px solid var(--border2);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent2);background:rgba(201,169,106,.07)}
.btn-ai{background:transparent;border:1.5px solid rgba(139,124,246,.55);color:var(--purple);font-weight:600}
.btn-ai:hover:not(:disabled){background:rgba(139,124,246,.14);border-color:var(--purple);color:#a99cff}
.btn-ai:disabled{opacity:.4}
.facts .btn{flex:1;text-align:center;padding:9px;min-width:78px}
.btn-gen{flex:2;min-width:150px;padding:11px;position:relative;z-index:0;border:none;border-radius:11px;cursor:pointer;font-family:inherit;
  font-size:13.5px;font-weight:700;letter-spacing:1.2px;transition:.22s;
  background:linear-gradient(135deg,#e8d5a8,#c9a96a 45%,#8b7cf6 130%);color:#1a1509;
  box-shadow:0 4px 18px rgba(201,169,106,.28)}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 9px 32px rgba(201,169,106,.5)}
.btn-gen::after{content:"";position:absolute;inset:-2px;border-radius:13px;z-index:-1;
  background:linear-gradient(120deg,var(--accent),var(--purple),var(--accent));
  background-size:220% 100%;filter:blur(9px);opacity:.55;animation:genPulse 3.4s linear infinite}
@keyframes genPulse{0%{background-position:0% 50%}100%{background-position:220% 50%}}
.btn-gen:active{transform:translateY(0) scale(.99)}

/* 右栏: 选项 / 3D */
.right{border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.rtabs{display:flex;border-bottom:1px solid var(--border)}
.rt{flex:1;text-align:center;font-size:11.5px;padding:10px 0;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:.2s}
.rt.on{color:var(--accent2);border-bottom-color:var(--accent)}
.rscroll{flex:1;overflow-y:auto;padding:14px}
.rscroll::-webkit-scrollbar{width:4px}.rscroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.otitle{font-size:12.5px;color:var(--accent2);margin-bottom:4px;font-weight:500}
.ohint{font-size:10.5px;color:var(--text3);margin-bottom:12px;line-height:1.6}
.ogroup{margin-bottom:14px}
.ogl{font-size:10px;color:var(--text3);margin-bottom:6px;letter-spacing:1.1px;display:flex;justify-content:space-between}
.ochips{display:flex;flex-wrap:wrap;gap:5px}
.oc{font-size:11.5px;padding:4.5px 11px;border-radius:100px;cursor:pointer;border:1px solid var(--border);
  color:var(--text2);transition:.16s;background:transparent}
.oc:hover{color:var(--text);border-color:var(--border2);transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(0,0,0,.2);background:rgba(255,255,255,.035)}
.oc.on{background:linear-gradient(135deg,rgba(201,169,106,.28),rgba(139,124,246,.18));
  border-color:rgba(201,169,106,.62);color:var(--accent2);font-weight:500;
  box-shadow:0 0 12px rgba(201,169,106,.22)}
.oinput{width:100%;background:var(--input);border:1px solid var(--border);border-radius:9px;padding:8px 11px;
  color:var(--text);font-size:12px;outline:none;font-family:inherit;margin-top:7px;resize:vertical}
.oinput:focus{border-color:rgba(201,169,106,.5)}
#viewWrap{flex:1;position:relative;min-height:0}
#viewWrap canvas{display:block;width:100%;height:100%}
.vhud{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:7px 11px;font-family:'Space Grotesk';
  font-size:11px;color:#e8d5a8;pointer-events:none}
.vhud small{display:block;color:rgba(255,255,255,.5);font-size:9.5px;margin-top:2px}
#splatBar{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:5}
.sbtn{font-size:11px;padding:5px 11px;border-radius:8px;cursor:pointer;font-family:inherit;
  border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.5);color:#e8d5a8;
  backdrop-filter:blur(8px);transition:.2s;white-space:nowrap}
.sbtn:hover{background:rgba(201,169,106,.25);border-color:rgba(201,169,106,.5)}
.sbtn:disabled{opacity:.55;cursor:wait}
#splatTip{position:absolute;bottom:10px;right:12px;font-size:10px;color:rgba(255,255,255,.45);
  letter-spacing:1px;font-family:'Noto Sans SC'}

/* 弹窗/提示 */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.62);backdrop-filter:blur(7px)}
.modal.show{display:flex}
.mcard{width:380px;max-width:92vw;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.mcard h3{font-size:16px;margin-bottom:5px;text-align:center;font-weight:600}
.mcard .sub{font-size:11.5px;color:var(--text3);text-align:center;margin-bottom:15px}
.mcard input{width:100%;background:var(--input);border:1px solid var(--border);border-radius:9px;
  padding:10px 12px;color:var(--text);font-size:13px;outline:none;font-family:inherit;margin-bottom:9px}
.err{color:#e06c6c;font-size:11.5px;min-height:16px;text-align:center;margin-bottom:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);
  border:1px solid rgba(201,169,106,.45);color:var(--accent2);padding:9px 22px;border-radius:100px;
  font-size:12px;z-index:300;transition:transform .32s cubic-bezier(.2,.9,.3,1.2);box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top">
  <div class="logo"><div class="logo-mark">✦</div><div class="logo-name">Prompt<em>Atelier</em></div></div>
  <div class="tb">
    <button class="ib" id="themeBtn" title="主题">🌙</button>
    <a class="btn" href="/lens" target="_blank">🎥 镜头工作台</a>
    <button class="btn btn-ghost" id="aiBadge" style="display:none" onclick="openLogin('AI 设置')">⚡ AI</button>
    <span class="uchip" id="uchip" style="display:none"><span class="av" id="av">A</span><span id="unm"></span></span>
    <button class="ib" id="loginBtn" onclick="openLogin()" title="登录">⚙</button>
    <button class="btn btn-ghost" id="logoutBtn" style="display:none" onclick="logout()">退出</button>
  </div>
</div>

<div class="grid">
  <!-- 左: 起点库 -->
  <div class="left">
    <div class="lt">起点库</div>
    <div class="sbox"><input id="sSearch" placeholder="搜索模板 / 案例…" oninput="renderStarters()"></div>
    <div class="tabs2">
      <div class="t2 on" id="tabTpl" onclick="switchSrc('tpl')">体系模板</div>
      <div class="t2" id="tabCase" onclick="switchSrc('case')">案例起点</div>
    </div>
    <div class="lscroll" id="libList"></div>
  </div>

  <!-- 中: 提示词画布 -->
  <div class="mid">
    <div class="mhead">
      <span class="mtitle">提示词画布 · 点击方块编辑</span>
      <span class="progress">
        <span class="pnum" id="pnum">0 / 10</span>
        <span class="pbar"><i id="pbar" style="width:0%"></i></span>
      </span>
    </div>
    <div class="bgrid" id="blocks"></div>
    <div class="mfoot">
      <div class="fh">
        <span class="ft">完整提示词</span>
        <span class="ft" id="syncInfo" style="text-transform:none;letter-spacing:0;color:var(--green)"></span>
        <span class="ft" id="srcInfo" style="text-transform:none;letter-spacing:0"></span>
      </div>
      <div class="out" id="out"><div class="ph">点击上方方块，从右侧选择参数 ✦ 提示词将实时生成</div></div>
      <div class="facts">
        <button class="btn-gen" id="btnGen" onclick="syncPrompt('手动生成')">✦ 生成提示词</button>
        <button class="btn btn-outline" id="btnCopy" onclick="copyOut()">⧉ 复制</button>
        <button class="btn btn-ai" id="btnAI" onclick="aiEnhance()" disabled>✦ AI 增强</button>
        <button class="btn" onclick="resetAll()">↺ 清空</button>
      </div>
    </div>
  </div>

  <!-- 右: 选项 / 3D -->
  <div class="right">
    <div class="rtabs">
      <div class="rt on" id="rtOpt" onclick="switchRight('opt')">参数选项</div>
      <div class="rt" id="rt3d" onclick="switchRight('3d')">3D 预览</div>
      <div class="rt" id="rtSet" onclick="switchRight('set')">设置</div>
    </div>
    <div class="rscroll" id="paneOpt">
      <div class="otitle" id="oTitle">🎯 主体场景</div>
      <div style="height:2px;width:38px;border-radius:2px;margin:-2px 0 10px;background:linear-gradient(90deg,var(--accent),var(--purple))"></div>
      <div class="ohint" id="oHint">点选下方选项，或直接输入</div>

    <div id="pane3d" style="display:none;flex:1;position:relative;min-height:0">
      <div id="viewWrap">
        <div class="vhud" id="vHud">实时预览<small>选择参数后自动更新</small></div>
        <div id="splatBar">
          <input type="file" id="splatFile" accept="image/*" style="display:none">
          <button class="sbtn" id="splatImport" title="导入图片 → 生成 3D 场景">🖼 图片转 3D</button>
          <button class="sbtn" id="splatReset" style="display:none" title="恢复室内场景">↺ 恢复</button>

      <div class="otitle">⚙ 设置</div>

      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)">

      <div style="font-size:10px;color:var(--text3);margin:11px 0 5px">BASE URL</div>
      <input class="oinput" id="llmBaseUrl" placeholder="https://api.openai.com/v1" style="margin:0">

      <button class="btn btn-gold" style="width:100%;margin-top:13px;padding:10px" onclick="saveLlm()">保存配置</button>
      <div style="font-size:11px;color:var(--text3);margin-top:7px" id="saveRes"></div>
      <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
          <span class="otitle" style="font-size:13px;margin:0">我的模板</span>

<div id="jsErr" style="display:none;position:fixed;left:8px;bottom:8px;background:#3a1010;color:#f88;padding:6px 12px;border-radius:8px;font-size:11px;z-index:999;max-width:70vw"></div>
<div class="toast" id="toast"></div>
<noscript><div style="position:fixed;inset:0;background:#0a0a0f;color:#e8e6e1;display:flex;align-items:center;justify-content:center;z-index:999;font-family:sans-serif">请启用 JavaScript 后访问</div></noscript>

<style>
.sw{position:relative;display:inline-block;width:38px;height:21px}
.sw input{opacity:0;width:0;height:0}
.sll{position:absolute;cursor:pointer;inset:0;background:var(--border2);border-radius:21px;transition:.3s}
.sll:before{content:"";position:absolute;height:15px;width:15px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.sll{background:linear-gradient(135deg,#d8b877,#8b7cf6)}
input:checked+.sll:before{transform:translateX(17px)}
</style>

<script src="/static/three.min.js"></script>
<script src="/static/ort/ort.min.js"></script>
<script src="/static/gaussian-splat.js"></script>
<script src="/static/studio-scene.js"></script>
<script>

/* ═══════ 状态 ═══════ */
const BLOCKS = [
  {id:'subject',    icon:'🎯', name:'主体场景', hint:'画面的核心内容', type:'text'},
  {id:'character',  icon:'👤', name:'人物特征', hint:'是否有人物 + 特征（可多选）', type:'multi', hasSwitch:true},
  {id:'style',      icon:'🎨', name:'视觉风格', hint:'整体风格取向', type:'multi'},
  {id:'lighting',   icon:'💡', name:'光线氛围', hint:'光源与情绪（可多选）', type:'multi'},
  {id:'color',      icon:'🌈', name:'色彩调性', hint:'主色与色温（可多选）', type:'multi'},
  {id:'grading',    icon:'🎞️', name:'调色滤镜', hint:'色彩分级风格（可多选）', type:'multi'},
  {id:'gear',       icon:'📷', name:'摄影器材', hint:'机身 / 镜头 / 光圈 / 胶片', type:'multi'},
  {id:'exposure',   icon:'⚙️', name:'拍摄参数', hint:'快门 / ISO / 白平衡 / 画幅', type:'multi'},
  {id:'composition',icon:'📐', name:'构图技法', hint:'机位 / 景别 / 构图（可多选）', type:'multi'},
  {id:'negative',   icon:'🚫', name:'负面约束', hint:'不想要的效果', type:'multi'},
];
const S = {
  active:'subject',
  blocks:{},          /* blocks[id] = {text:'', items:[], groups:{}} */
  tpl:null,           /* 当前体系模板 */
  rightView:'opt',
  srcTab:'tpl',
};
BLOCKS.forEach(b=>{S.blocks[b.id]={text:'',items:[],groups:{},enabled:b.hasSwitch?false:true,userEdited:false}});

let lib={templates:[]}, starters=[], allParams=null, myTpls=[], isLogged=false;

window.addEventListener('error',e=>{
  const d=document.getElementById('jsErr');
  if(d){d.style.display='block';d.textContent='JS 错误: '+(e.message||e.type)}
});
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)};
async function api(u,o={}){try{const r=await fetch(u,{headers:{'Content-Type':'application/json'},credentials:'include',...o});return await r.json()}catch(e){return{ok:false,msg:'网络错误'}}}
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ═══════ 主题 ═══════ */
const TH=['auto','dark','light'],TI={auto:'🌗',dark:'🌙',light:'☀️'};
let themeMode=localStorage.getItem('pa-theme')||'auto';
function applyTheme(){
  const sys=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  const eff=themeMode==='auto'?sys:themeMode;
  document.documentElement.setAttribute('data-theme',eff);
  $('themeBtn').textContent=TI[themeMode];
  if(window.__sceneBg)try{window.__sceneBg(eff)}catch(e){}
}
$('themeBtn').onclick=()=>{themeMode=TH[(TH.indexOf(themeMode)+1)%3];localStorage.setItem('pa-theme',themeMode);applyTheme()};
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(themeMode==='auto')applyTheme()});
applyTheme();

/* ═══════ 加载 ═══════ */
async function loadAll(){
  const [lr,pr,sr]=await Promise.all([api('/api/library'),api('/api/all-params'),api('/api/starters')]);
  if(lr.ok)lib=lr.data;
  if(pr.ok)allParams=pr.data;
  if(sr.ok)starters=sr.data.starters||[];
  renderStarters();renderBlocks();
}
function renderStarters(){
  const q=($('sSearch').value||'').trim().toLowerCase();
  const el=$('libList');let h='';
  if(S.srcTab==='tpl'){
    const g={};
    (lib.templates||[]).forEach(t=>{const k=t.category||'其他';(g[k]=g[k]||[]).push(t)});
    Object.keys(g).forEach(k=>{
      const items=g[k].filter(t=>!q||JSON.stringify(t).toLowerCase().includes(q));
      if(!items.length)return;
      h+=`<div class="grp">${esc(k)}</div>`;
      items.forEach(t=>h+=`<div class="starter ${S.tpl&&S.tpl.id===t.id?'on':''}" onclick="pickTpl('${t.id}')">
        <span>${esc(t.title)}</span><span class="ar">→</span></div>`);
    });
    if(myTpls.length){
      h+=`<div class="grp">我的模板</div>`;
      myTpls.forEach(t=>h+=`<div class="starter" onclick="pickMyTpl('${t.id}')"><span>${esc(t.title)}</span><span class="ar">→</span></div>`);
    }
  }else{
    const list=q?starters.filter(s=>JSON.stringify(s).toLowerCase().includes(q)):starters;
    h+=`<div class="grp">案例起点 · ${list.length} 个${q?'（搜索结果）':''}</div>`;
    list.slice(0,600).forEach(s=>h+=`<div class="starter" onclick="pickCase(${s.id})">
      <span>${esc(s.title)}</span><span class="cc">${esc((s.category||'').replace(' & ','/').slice(0,10))}</span></div>`);
    if(list.length>600)h+=`<div class="grp">显示前 600 条，请用搜索缩小范围</div>`;
  }
  el.innerHTML=h||'<div style="font-size:12px;color:var(--text3);padding:12px">无匹配</div>';
}
function switchSrc(t){S.srcTab=t;$('tabTpl').classList.toggle('on',t==='tpl');$('tabCase').classList.toggle('on',t==='case');renderStarters()}

/* ═══════ 块渲染 ═══════ */
function blkVal(id){
  const b=S.blocks[id];
  const parts=[];
  if(b.text)parts.push(b.text);
  (b.items||[]).forEach(i=>parts.push(i.zh));
  Object.values(b.groups||{}).forEach(g=>parts.push(g.zh));
  return parts;
}
function renderBlocks(){
  const el=$('blocks');let h='';
  BLOCKS.forEach(b=>{
    const bd=S.blocks[b.id];
    const vals=blkVal(b.id);
    const filled=vals.length>0;
    /* 人物块未开启时显示为禁用 */
    const disabled=(b.hasSwitch&&!bd.enabled);
    const statusTxt=disabled?'未开启':(filled?'已填 '+vals.length:'未设置');
    const stCls=disabled?'':(filled?'done':'');
    h+=`<div class="blk ${S.active===b.id?'active':''} ${filled&&!disabled?'filled':''}" onclick="actBlock('${b.id}')">
      <span class="bdel" onclick="event.stopPropagation();clearBlock('${b.id}')">✕</span>
      <div class="bh">
        <span class="bi">${b.icon}</span><span class="bn">${b.name}</span>
        <span class="bs ${stCls}">${statusTxt}</span>
      </div>`;
    if(disabled){
      h+=`<div class="bv empty">点击开启人物后可选特征</div>`;
    } else if(filled){
      if(bd.text){
        /* 长文本(多为案例原文)折叠显示, 避免中英混杂 */
        const t=bd.text;
        if(t.length>44)h+=`<div class="bv" style="color:var(--text3)">📎 案例原文 ${t.length} 字 <span style="opacity:.7">(点击块查看/编辑)</span></div>`;
        else h+=`<div class="bv">${esc(t)}</div>`;
      }
      const tags=[...(bd.items||[]).map(i=>i.zh),...Object.values(bd.groups||{}).map(g=>g.zh)];
      if(tags.length)h+=`<div class="chips-inline">${tags.slice(0,5).map(t=>`<span class="cchip">${esc(t)}</span>`).join('')}${tags.length>5?`<span class="cchip">+${tags.length-5}</span>`:''}</div>`;
    } else {
      h+=`<div class="bv empty">${esc(b.hint)}</div>`;
    }
    h+=`</div>`;
  });
  el.innerHTML=h;
  /* 进度 */
  const done=BLOCKS.filter(b=>{
    const bd=S.blocks[b.id];
    if(b.hasSwitch&&!bd.enabled)return false;
    return blkVal(b.id).length>0;
  }).length;
  $('pnum').textContent=done+' / '+BLOCKS.length;
  $('pbar').style.width=(done/BLOCKS.length*100)+'%';
  renderOutput();
}

/* ═══════ 激活块 → 右侧选项 ═══════ */
function actBlock(id){
  S.active=id;
  switchRight('opt');
  renderOpts();renderBlocks();
}
function renderOpts(){
  const b=BLOCKS.find(x=>x.id===S.active);
  const bd=S.blocks[S.active];
  $('oTitle').textContent=b.icon+' '+b.name;
  $('oHint').textContent=b.hint;
  const el=$('oBody');let h='';
  /* 人物开关 */
  if(b.hasSwitch){
    h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 11px;
      background:var(--input);border:1px solid var(--border);border-radius:10px;margin-bottom:12px">
      <span style="font-size:12.5px">画面中包含人物</span>
      <label class="sw"><input type="checkbox" id="charSw" ${bd.enabled?'checked':''} onchange="toggleChar(this.checked)"><span class="sll"></span></label>
    </div>`;
    if(!bd.enabled){el.innerHTML=h;return}
  }
  const src=getOptSource(S.active);
  if(S.active==='subject'){
    h+=`<textarea class="oinput" style="min-height:64px" placeholder="描述画面主体…" oninput="setText('subject',this.value)">${esc(bd.text)}</textarea>`;
  }
  src.forEach(g=>{
    h+=`<div class="ogroup"><div class="ogl"><span>${esc(g.name)}</span></div><div class="ochips">`;
    g.items.forEach((it,i)=>{
      const on=isSel(S.active,g.id,i);
      h+=`<span class="oc ${on?'on':''}" title="${esc(it.tag||it.prompt||'')}" onclick="pickItem('${S.active}','${g.id}',${i},event)">${esc(it.zh)}</span>`;
    });
    h+=`</div></div>`;
  });
  /* 所有块都支持自定义补充 */
  if(S.active!=='subject'){
    h+=`<div class="ogroup" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
      <div class="ogl"><span>自定义补充</span></div>
      <textarea class="oinput" style="min-height:56px" placeholder="自行输入或粘贴内容…"
        oninput="setText('${S.active}',this.value)">${esc(bd.text)}</textarea>
    </div>`;
  }
  el.innerHTML=h;
}
function getOptSource(field){
  const st=allParams?.styles?.groups||[], ex=allParams?.ext||{};
  const by=ids=>st.filter(g=>ids.includes(g.id));
  if(field==='subject')return ex.subjects?.groups||[];
  if(field==='character')return ex.characters?.groups||[];
  if(field==='style')return [
    {id:'style_preset',name:'常用风格',items:STYLE_PRESETS},
    ...by(['filter','lighting']).map(g=>({id:'style_'+g.id,name:g.name,items:g.items}))
  ];
  if(field==='lighting')return by(['lighting']);
  if(field==='color')return [{id:'color_preset',name:'色彩方案',items:COLOR_PRESETS}];
  if(field==='grading')return by(['filter']);
  if(field==='gear')return by(['camera','lens','aperture','film']);
  if(field==='exposure')return ex.camera_details?.groups||[];
  if(field==='composition')return by(['composition_tech']);
  if(field==='negative')return [{id:'neg_preset',name:'常见负面',items:NEG_PRESETS}];
  return [];
}
const STYLE_PRESETS=[
  {zh:'写实摄影',prompt:'photorealistic photography'},
  {zh:'3D 渲染',prompt:'3D render, octane render, subsurface scattering'},
  {zh:'水彩插画',prompt:'watercolor illustration, soft washes, paper texture'},
  {zh:'极简海报',prompt:'minimalist poster design, clean vector shapes'},
  {zh:'暗黑高级',prompt:'dark moody premium aesthetic, low-key luxury'},
  {zh:'赛博朋克',prompt:'cyberpunk aesthetic, neon glow, high tech'},
  {zh:'国风水墨',prompt:'chinese ink wash painting, oriental aesthetic'},
  {zh:'胶片质感',prompt:'analog film look, grain, halation'},
  {zh:'超现实',prompt:'surrealism, dreamlike impossible scene'},
  {zh:'杂志大片',prompt:'editorial magazine fashion photography'},
  {zh:'Y2K',prompt:'Y2K aesthetic, chrome, retro futuristic'},
  {zh:'动漫插画',prompt:'anime illustration, cel shading, vibrant'}
];
const COLOR_PRESETS=[
  {zh:'暖金色调',prompt:'warm golden palette'},{zh:'冷蓝调',prompt:'cool blue palette'},
  {zh:'莫兰迪灰调',prompt:'Morandi muted palette'},{zh:'高饱和撞色',prompt:'bold saturated contrast palette'},
  {zh:'黑白灰',prompt:'monochrome black and white'},{zh:'粉彩柔调',prompt:'soft pastel palette'},
  {zh:'青橙对撞',prompt:'teal and orange palette'},{zh:'大地色系',prompt:'earth tone palette'},
  {zh:'霓虹赛博',prompt:'neon cyber palette'},{zh:'低饱和高级灰',prompt:'desaturated premium grey palette'}
];
const NEG_PRESETS=[
  {zh:'避免过度磨皮',prompt:'avoid over-smoothed skin'},{zh:'避免塑料皮肤',prompt:'avoid plastic skin'},
  {zh:'避免AI假人感',prompt:'avoid uncanny AI look'},{zh:'避免五颜六色',prompt:'avoid garish oversaturation'},
  {zh:'避免影楼感',prompt:'avoid cheesy studio look'},{zh:'避免多余文字',prompt:'avoid unwanted text and watermarks'},
  {zh:'避免肢体畸形',prompt:'avoid deformed hands'},{zh:'避免杂乱背景',prompt:'avoid cluttered background'},
  {zh:'避免廉价特效',prompt:'avoid cheap HDR glow'},{zh:'避免过度锐化',prompt:'avoid over-sharpening'}
];
function isSel(field,gid,idx){
  const b=S.blocks[field];
  return (b.items||[]).some(i=>i.gid===gid&&i.idx===idx);
}
function pickItem(field,gid,idx,ev){
  const g=getOptSource(field).find(x=>x.id===gid);if(!g)return;
  const it=g.items[idx];const b=S.blocks[field];
  const blk=BLOCKS.find(x=>x.id===field);
  {
    b.items=b.items||[];
    const pos=b.items.findIndex(i=>i.gid===gid&&i.idx===idx);
    if(pos>=0)b.items.splice(pos,1);
    else{
      /* 仅人物块组内互斥(表情/服装等), 其余块自由多选 */
      if(field==='character'){for(let i=b.items.length-1;i>=0;i--)if(b.items[i].gid===gid)b.items.splice(i,1)}
      b.items.push({gid,idx,zh:it.zh,prompt:it.prompt||''});
    }
  }
  /* 局部更新高亮 */
  const wrap=ev&&ev.target?ev.target.closest('.ochips'):null;
  if(wrap){
    const gsrc=getOptSource(field).find(x=>x.id===gid);
    wrap.querySelectorAll('.oc').forEach((c,i)=>c.classList.toggle('on',isSel(field,gid,i)));
  }
  S.blocks[field].userEdited=true;
  renderBlocks();
  syncPrompt('选择参数');
}
function setText(field,v){
  S.blocks[field].text=v;S.blocks[field].userEdited=true;
  /* 轻量更新: 不重建DOM, 避免输入时丢焦点 */
  renderOutput();updateProgressLight();updateBlockStates();
  if(window.__update3D)window.__update3D();
}
function updateProgressLight(){
  const done=BLOCKS.filter(b=>{
    const bd=S.blocks[b.id];
    if(b.hasSwitch&&!bd.enabled)return false;
    return blkVal(b.id).length>0;
  }).length;
  $('pnum').textContent=done+' / '+BLOCKS.length;
  $('pbar').style.width=(done/BLOCKS.length*100)+'%';
}
function updateBlockStates(){
  document.querySelectorAll('#blocks .blk').forEach((el,i)=>{
    const b=BLOCKS[i];if(!b)return;
    const bd=S.blocks[b.id];
    const filled=blkVal(b.id).length>0&&!(b.hasSwitch&&!bd.enabled);
    el.classList.toggle('filled',filled);
    el.classList.toggle('active',S.active===b.id);
    const st=el.querySelector('.bs');
    if(st){
      const disabled=(b.hasSwitch&&!bd.enabled);
      st.textContent=disabled?'未开启':(filled?'已填 '+blkVal(b.id).length:'未设置');
      st.className='bs '+(disabled?'':(filled?'done':''));
    }
  });
}
function clearBlock(id){
  const b=S.blocks[id];
  b.text='';b.items=[];b.groups={};b.userEdited=false;
  if(BLOCKS.find(x=>x.id===id).hasSwitch)b.enabled=false;
  renderBlocks();renderOpts();syncPrompt('清空『'+BLOCKS.find(x=>x.id===id).name+'』');
  toast('已清空该块');
}
function toggleChar(on){
  S.blocks.character.enabled=on;renderBlocks();renderOpts();
  if(!on){S.blocks.character.items=[];S.blocks.character.groups={}}
  if(window.__update3D)window.__update3D();
}

/* ═══════ 案例英文 → 智能匹配中文选项 ═══════ */
/* 关键词 → 中文选项 提示表(提升案例匹配准确率) */

  color:{sage:'莫兰迪灰调',olive:'大地色系',beige:'暖金色调',muted:'莫兰迪灰调',pastel:'粉彩柔调',

function matchByHint(field,seg){
  const hints=KEY_HINTS[field];if(!hints)return null;
  const low=seg.toLowerCase();
  for(const [kw,zh] of Object.entries(hints)){
    if(low.includes(kw)){
      const src=getOptSource(field);
      for(const g of src){
        const i=g.items.findIndex(it=>it.zh===zh||it.zh.startsWith(zh.split(' ')[0]));
        if(i>=0)return {gid:g.id,idx:i,zh:g.items[i].zh,prompt:g.items[i].prompt||''};
      }
    }
  }
  return null;
}

function matchCaseSegments(field, segs){
  const src=getOptSource(field);
  const matched=[],leftover=[];
  const stop=new Set(['the','and','with','for','from','that','this','into','over','under','very','soft','light','style']);
  segs.forEach(seg=>{
    /* ① 关键词表优先 */
    const hinted=matchByHint(field,seg);
    if(hinted){matched.push(hinted);return}
    /* ② 词交集打分兜底 */
    const words=new Set((seg.toLowerCase().match(/[a-z]{3,}/g)||[]).filter(w=>!stop.has(w)));
    if(!words.size){leftover.push(seg);return}
    let best=null,bestScore=0;
    src.forEach(g=>g.items.forEach((it,i)=>{
      const pw=new Set(((it.prompt||'')+' '+(it.zh||'')).toLowerCase().match(/[a-z]{3,}/g)||[]);
      if(!pw.size)return;
      let hit=0;pw.forEach(w=>{if(words.has(w))hit++});
      const score=hit/Math.min(6,Math.max(2,pw.size));
      if(score>bestScore){bestScore=score;best={gid:g.id,idx:i,zh:it.zh,prompt:it.prompt||'',split:g.items}}
    }));
    if(best&&bestScore>=0.34)matched.push(best);
    else leftover.push(seg);
  });
  return {matched,leftover};
}

/* ═══════ 拼装提示词 ═══════ */
function buildPrompt(){
  const p=[];
  const B=S.blocks;
  if(S.tpl)p.push('【模板】'+S.tpl.title);
  const add=(label,vals)=>{const v=vals.filter(Boolean);if(v.length)p.push(label+'：'+v.join(', '))};
  /* 选项统一输出英文(prompt), 自由文本保持原样 → 最终提示词以英文为主 */
  const en=i=>i.prompt||i.zh;
  const enG=g=>g.prompt||g.zh;
  add('主体与场景',[B.subject.text]);
  if(B.character.enabled)add('人物',[...(B.character.items||[]).map(en),...Object.values(B.character.groups||{}).map(enG)]);
  add('视觉风格',[...(B.style.items||[]).map(en),B.style.text]);
  add('光线氛围',[...(B.lighting.items||[]).map(en),B.lighting.text]);
  add('色彩调性',[...(B.color.items||[]).map(en),B.color.text]);
  add('调色滤镜',[...(B.grading.items||[]).map(en),B.grading.text]);
  add('摄影器材',[...(B.gear.items||[]).map(en),B.gear.text]);
  add('拍摄参数',[...(B.exposure.items||[]).map(en),B.exposure.text]);
  add('构图技法',[...(B.composition.items||[]).map(en),B.composition.text]);
  const neg=[...(B.negative.items||[]).map(en)].filter(Boolean);
  if(!neg.length)neg.push('avoid oversaturated colors, plastic skin, uncanny AI look, unwanted text');
  p.push('Negative: '+neg.join(', '));
  return p.join('\n');
}

function persistState(){
  try{
    const snap={tpl:S.tpl?{id:S.tpl.id,title:S.tpl.title}:null,
      blocks:{},text:buildPrompt()};
    BLOCKS.forEach(b=>{const bd=S.blocks[b.id];
      snap.blocks[b.id]={text:bd.text,items:(bd.items||[]).map(i=>({zh:i.zh,prompt:i.prompt})),enabled:bd.enabled};});
    localStorage.setItem('pa-state',JSON.stringify(snap));
  }catch(e){}
}

function pickTpl(id){
  const t=lib.templates.find(x=>x.id===id);if(!t)return;
  S.tpl=t;
  const g=Array.isArray(t.guidance)?t.guidance.join('；'):(t.guidance||'');
  const pf=Array.isArray(t.pitfalls)?t.pitfalls.join('；'):(t.pitfalls||'');
  let updated=0,kept=0;
  /* 未被用户手动改过的块 → 跟随模板更新; 改过的 → 保留 */
  const put=(field,val,asItems)=>{
    const b=S.blocks[field];
    if(b.userEdited){kept++;return}
    if(asItems){
      b.items=(val||[]).map((z,i)=>({gid:'tpl_'+field,idx:i,zh:z,prompt:z}));
    }else b.text=val||'';
    updated++;
  };
  put('composition',g);
  put('negative',pf?pf.split('；').filter(Boolean):[],true);
  put('style',t.styles||[],true);
  renderStarters();renderBlocks();renderOpts();
  if(window.__update3D)window.__update3D();
  syncPrompt('模板「'+t.title+'」');
  toast(`已应用「${t.title}」· 更新 ${updated} 个块${kept?`，保留你修改的 ${kept} 个块`:''}`);
}
function pickCase(cid){
  const st=starters.find(x=>x.id===cid);if(!st)return;
  if(S.blocks.subject.text&&!confirm('主体场景已有内容，是否覆盖？'))return;
  let prompt=(st.prompt||'').trim();
  let split=null;

  /* ① JSON 结构案例 → 按字段拆 */
  if(prompt.startsWith('{')){
    try{
      const o=JSON.parse(prompt);
      split={};
      const scene=[o.scene,o.subject,o.detail].filter(Boolean).join(' ');
      if(scene)split.subject=(o.title?`【${o.title}】`:'')+scene;
      if(o.lighting)split.lighting=o.lighting;
      if(o.style)split.style=o.style;
      if(o.composition)split.composition=o.composition;
      if(o.atmosphere)split.color=o.atmosphere;
      prompt=scene||prompt;
    }catch(e){}
  }

  /* ② 自然语言案例 → 启发式拆句归类 */
  if(!split){
    const segs=prompt.split(/[,;.]\s+/).map(x=>x.trim()).filter(x=>x.length>4);
    const cat={style:[],lighting:[],color:[],composition:[],grading:[],gear:[],subject:[]};
    segs.forEach(seg=>{
      const t=seg.toLowerCase();
      if(/\b(light|lighting|sunlight|shadow|illuminat|glow|golden hour|backlit|neon)\b/.test(t)
         ||/光照|光线|阳光|阴影/.test(seg)) cat.lighting.push(seg);
      else if(/palette|colour|color tone|color scheme|\bhue\b|monochrom|pastel|saturat|duotone|grading|色调|配色|色彩|muted|sage|olive|beige|teal|indigo|crimson|emerald|amber|charcoal|ivory|navy|maroon|lavender|turquoise|(warm|pale|soft|deep|rich|dark)\s+(green|blue|red|grey|gray|yellow|orange|pink|purple|brown|white|black)/i.test(t)) cat.color.push(seg);
      else if(/\d+\s*mm|f\s*\/\s*\d|bokeh|depth of field|shutter|iso\s*\d|lens\b|camera|焦段|光圈|快门/.test(t)) cat.gear.push(seg);
      else if(/composition|wide-angle|close-up|perspective|framing|\bangle\b|layout|symmetr|crop|focal point|构图|机位|景别/.test(t)) cat.composition.push(seg);
      else if(/style|illustration|realistic|cinematic|anime|watercolor|vector|3d render|art\b|aesthetic|poster art|photograph|film|风格|插画/.test(t)) cat.style.push(seg);
      else cat.subject.push(seg);
    });
    /* 有把握的才拆(每类至少1句且不属于主体主导) */
    const hasAny=(cat.style.length+cat.lighting.length+cat.color.length+cat.composition.length+cat.gear.length)>0;
    if(hasAny){
      split={
        subject: (cat.subject.length?cat.subject.join(', '):prompt.slice(0,400)),
        style: cat.style.join(', '),
        lighting: cat.lighting.join(', '),
        color: cat.color.join(', '),
        composition: cat.composition.join(', '),
        gear: cat.gear.join(', ')
      };
    }
  }

  if(split){
    /* 主体保留原文; 其他类别 → 智能匹配中文选项(选中), 匹配不到的走自由文本 */
    S.blocks.subject.text=prompt.slice(0,700);
    let totalHit=0,totalRest=0;
    [['style','style'],['lighting','lighting'],['color','color'],['composition','composition'],['gear','gear']].forEach(([field,key])=>{
      const txt=split[key];if(!txt)return;
      const segs=txt.split(/[,;|]\s*/).map(x=>x.trim()).filter(x=>x.length>3);
      const {matched,leftover}=matchCaseSegments(field,segs);
      const b=S.blocks[field];
      matched.forEach(m=>{
        if(!(b.items||[]).some(x=>x.gid===m.gid&&x.idx===m.idx))
          b.items.push({gid:m.gid,idx:m.idx,zh:m.zh,prompt:m.prompt});
      });
      if(leftover.length)b.text=((b.text?b.text+' | ':'')+leftover.join(', ')).slice(0,300);
      totalHit+=matched.length;totalRest+=leftover.length;
    });
    toast(`已载入「${st.title}」· 自动选中 ${totalHit} 个选项${totalRest?`，${totalRest} 条原文补充`:''}`);
  } else {
    S.blocks.subject.text=prompt.slice(0,700);
    toast('已载入案例：'+st.title);
  }

  renderBlocks();renderOpts();switchSrc('case');
  if(window.__update3D)window.__update3D();
  setTimeout(()=>{if(window.__update3D)window.__update3D()},260);
}

function update3D(){
  if(!studio3d)return;
  const B=S.blocks;
  const j=arr=>arr.filter(Boolean).join(' ');

  /* 主体文本(含案例内容)参与分析 → 案例与3D是同一套 */
  const subjTxt=B.subject.text||'';
  const peopleWord=/woman|women|girl|man|men|boy|person|people|portrait|couple|model|female|male|figure|character|human|child|人物|女|男|少女|人像|情侣|模特|肖像/i.test(subjTxt);
  const charOn=B.character.enabled||peopleWord;
  if(charOn&&!B.character.enabled){const sw=document.querySelector('#paneOpt .sw input');
    if(sw&&!sw.checked){sw.checked=true;S.blocks.character.enabled=true;}}

  const styleTxt=j([...B.style.items.map(i=>i.zh),B.style.text,subjTxt,B.composition.text,
    ...Object.values(B.character.groups||{}).map(g=>g.zh),...(B.character.items||[]).map(i=>i.zh)]);
  const lightTxt=j([...(B.lighting.items||[]).map(i=>i.zh),B.lighting.text,styleTxt,subjTxt]);
  const gradTxt=j([...(B.grading.items||[]).map(i=>i.zh+' '+(i.prompt||'')),...(B.color.items||[]).map(i=>i.zh),B.color.text,B.grading.text,subjTxt]);
  const gearTxt=j([...(B.gear.items||[]).map(i=>i.zh+' '+(i.prompt||'')),B.gear.text,
    ...(B.exposure.items||[]).map(i=>i.zh+' '+(i.prompt||'')),B.exposure.text,subjTxt]);

  /* 人物 */
  const col=guessColors(styleTxt);
  studio3d.setPerson(charOn,col);
  /* 光线 / 色调 / 氛围 */
  const lightName=studio3d.setLighting(lightTxt);
  studio3d.setTone(gradTxt);
  studio3d.setAtmosphere(subjTxt+' '+lightTxt+' '+gradTxt);
  /* 镜头(焦距/光圈) */
  const mF=gearTxt.match(/(\d{2,3})\s*mm/i);
  const fl=mF?parseInt(mF[1]):50;
  const mA=gearTxt.match(/f\s*\/\s*([\d.]+)/i);
  const ap=mA?parseFloat(mA[1]):2.8;
  studio3d.setLens(fl,ap);
  studio3d.setFocus(-0.2);
  try{localStorage.setItem('pa-lens-cur',JSON.stringify({focal:fl,aperture:ap}))}catch(e){}   /* 焦点对准主体 */

  $('vHud').innerHTML=`${charOn?'👤 人物':'◎ 无人物'} · ${lightName}<small>${fl}mm f/${ap}</small>`;
}

/* ═══════ 高斯泼溅(图片 → 3D) ═══════ */
async function handleSplatFile(file){
  if(!file)return;
  const vib=$('vHud'), btn=$('splatImport');
  btn.disabled=true; btn.textContent='处理中…';
  vib.innerHTML='读取图片…<small>准备中</small>';
  try{
    const img=await SplatLab.fileToImage(file);
    vib.innerHTML='估算深度…<small>首次需加载模型(约26MB)</small>';
    const pts=await SplatLab.imageToSplat(img,{
      density:190, depthScale:1.7, spread:1.0,
      onProgress:m=>{vib.innerHTML=m+'<small>Depth-Anything-V2 · 浏览器内推理</small>'}
    });
    vib.innerHTML='构建泼溅…<small>生成 '+pts.geometry.attributes.position.count.toLocaleString()+' 个高斯点</small>';
    ensureStudio();
    studio3d.setSplat(pts);
    saveSplatImage(img);            /* 存源图供镜头台同步 */
    $('splatReset').style.display='';
    $('splatTip').style.display='';
    vib.innerHTML='🖼 图片 3D 场景<small>'+pts.geometry.attributes.position.count.toLocaleString()+' 高斯点</small>';
    toast('✅ 已生成 3D 场景');
  }catch(e){
    console.error(e);
    vib.innerHTML='❌ 失败<small>'+e.message.slice(0,40)+'</small>';
    toast('生成失败: '+e.message.slice(0,40));
  }finally{
    btn.disabled=false; btn.textContent='🖼 图片转 3D';
  }
}
/* 压缩并保存源图(base64), 供镜头台重建同一场景 */
function saveSplatImage(img){
  try{
    const max=1024;
    const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    const sc=Math.min(1, max/Math.max(iw,ih));
    const c=document.createElement('canvas');
    c.width=Math.round(iw*sc); c.height=Math.round(ih*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',0.82);
    localStorage.setItem('pa-splat-img',url);
    localStorage.setItem('pa-splat-meta',JSON.stringify({w:iw,h:ih,ts:Date.now()}));
  }catch(e){console.warn('save splat img failed',e)}
}
function resetSplat(){
  try{localStorage.removeItem('pa-splat-img');localStorage.removeItem('pa-splat-meta')}catch(e){}
  if(studio3d){studio3d.clearSplat();studio3d.setFocus(-0.2)}
  $('splatReset').style.display='none';
  $('splatTip').style.display='none';
  update3D();
  toast('已恢复室内场景');
}
function ensureStudio(){ if(!studio3d)init3D(); }

window.__init3D=init3D;
window.__update3D=update3D;
window.__sceneBg=eff=>{ if(!studio3d)return; studio3d.setTone(eff==='light'?'高调 bright':'暗黑 noir'); };

/* ═══════ 镜头参数互通 ═══════ */
function applyLensFromStorage(){
  try{
    const raw=localStorage.getItem('pa-lens');
    if(!raw)return;
    const d=JSON.parse(raw);
    if(!d||!d.snippet)return;
    S.blocks.gear.text=(S.blocks.gear.text?S.blocks.gear.text+'\n':'')+d.snippet;
    if(d.focal!=null)S.blocks.gear.__focal=d.focal;
    if(d.aperture!=null)S.blocks.gear.__ap=d.aperture;
    localStorage.removeItem('pa-lens');
    renderBlocks();renderOpts();
    if(window.__update3D)window.__update3D();
    actBlock('gear');
    toast('已应用镜头参数：'+d.lensName+' · '+d.comp+' · '+d.dof);
  }catch(e){}
}
window.__applyLens=applyLensFromStorage;

/* ═══════ 暴露到全局(ES module 的 onclick 需要) ═══════ */
Object.assign(window,{
  actBlock,clearBlock,pickItem,setText,toggleChar,renderOpts,renderBlocks,
  switchSrc,switchRight,openLogin,doLogin,logout,saveLlm,
  copyOut,aiEnhance,resetAll,pickTpl,pickCase,pickMyTpl,delMyTpl,
  openTplModal,saveTpl,closeModal,renderStarters
});

/* ═══════ 启动 ═══════ */
$('splatImport').onclick=()=>$('splatFile').click();
$('splatFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)handleSplatFile(f);e.target.value=''};
$('splatReset').onclick=resetSplat;
window.handleSplatFile=handleSplatFile;window.resetSplat=resetSplat;window.saveSplatImage=saveSplatImage;

(async function(){
  await refreshAuth();await loadAll();renderOpts();applyLensFromStorage();
  /* 若之前导入过图片, 自动重建泼溅场景 */
  try{
    const url=localStorage.getItem('pa-splat-img');
    if(url){
      const img=new Image();
      img.onload=async()=>{
        try{
          ensureStudio();
          const pts=await SplatLab.imageToSplat(img,{density:190,depthScale:1.7});
          studio3d.setSplat(pts);
          $('splatReset').style.display='';$('splatTip').style.display='';
          $('vHud').innerHTML='🖼 图片 3D 场景<small>'+pts.geometry.attributes.position.count.toLocaleString()+' 高斯点(已同步)</small>';
        }catch(e){}
      };
      img.src=url;
    }
  }catch(e){}
})();
</script>
